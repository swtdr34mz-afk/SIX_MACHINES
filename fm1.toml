# SIX MACHINES build settings (fm1-base tools/build.py). The screens' type (Barlow, smooth): X0X_FONTSET=barlow in the
# environment (the workflow sets it; for a local build: X0X_FONTSET=barlow python3 fm1-base/tools/build.py . --host)
name = "sixmachines"              # the build's file names: sixmachines-0.1.fwsc, build/host/sixmachines_host
title = "SIX MACHINES"            # the name people see (firmware hubs)
id_prefix = "FM-1_574"            # package identity: dev FM-1_57400, releases FM-1_574 + XXYYZZ (CHORD RUN 571, GRAIN PIANO 572, INSERT COIN 573)
usb_manufacturer = "swtdr34mz"
usb_product = "SIX MACHINES FM-1" # the USB name (the MIDI port in a DAW)
o2 = ["dsp/engine.c"]             # the sound engine, at -O2
include = ["dsp"]
vendored = ["fm1-base/"]          # fm1-base is a submodule inside the app: its own checks are its own
words = "words.tsv"
ble = false
backup = true                     # backup and restore of the settings
cpu2 = true                       # the second core renders TOMS, FM, HATS, CLAP
cpu2_fallback = true              # if it fails on an FM-1: one core on, no restart
tagline = "A performance drum machine: six machines, four knobs, all sweetspots"
repo = "https://github.com/swtdr34mz-afk/SIX_MACHINES"
licence = "MPL-2.0"
credits = "Built on fm1-base (Charles Vestal) and felucca-bsp (Leo Kuroshita, Hügelton Instruments)."
author = "swtdr34mz"
description = "A performance drum machine in the spirit of the Elektron boxes and the LXR-02: six synthesized machines (KICK, SNARE, TOMS, FM drum and FM cymbals, HATS, CLAP), each with four macro knobs that rest on sweetspots, its own saturation, envelope, LFO and mix. A sequencer of 16 or 32 steps with accents, parameter locks, trig conditions and retrigs; a master with compressor, warmth, tilt, reverb and ping-pong delay; 16 performance pads (beat repeat, tape stop, build-up and drop, throws, kills, freeze, scene morph). MIDI clock, START/STOP and its kick (note 36, ch 10) out over USB: it leads a synth."
tags = ["drum-machine", "synth"]
install = "https://github.com/swtdr34mz-afk/SIX_MACHINES/releases"
screenshot = "site/img/screen-main.png"
